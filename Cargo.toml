[package]
name = "hardviz"
version = "0.1.5"
default-run = "hardviz"
edition = "2021"
description = "Hardware monitoring dashboard: CPU, GPU, memory, temperatures, network and disks"
license = "MIT OR Apache-2.0"
# Also where the update check looks for new releases (src/update.rs).
repository = "https://github.com/liorbass/hardviz"
# It is an application, not a library — published so that `cargo install
# hardviz` works. The release archives stay the install that carries a Windows
# CPU-temperature source: see docs/install.md.
categories = ["hardware-support", "command-line-utilities", "gui"]
keywords = ["hardware-monitoring", "cpu", "gpu", "temperature", "monitor"]
# Source and documentation only. The release-engineering tree is not part of an
# install, and `vendor/` cannot be: those are Windows binaries, and a crate is
# source. `build.rs` warns about what that leaves out, on Windows.
exclude = [
    "/.cargo/",
    "/.github/",
    "/.githooks/",
    "/.signpath/",
    "/packaging/",
    "/vendor/",
    "/docs/images/demo-dashboard.gif",
    "/docs/images/demo-compact.gif",
]

# `xtask` holds the project tasks (`cargo dist`, `cargo tag`; see .cargo/config.toml).
[workspace]
members = ["xtask"]

[dependencies]
# The glow (OpenGL) renderer, as before 0.37 made wgpu the default: a much
# smaller binary, and no system fontconfig needed to build on Linux.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui = "0.37"
# Only to keep winit's default features (dlopen'd Wayland, client-side
# decorations), which eframe enables only together with wgpu by default.
winit = "0.30"
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.10"
directories = "5"
# Only the local-time clock, for log timestamps.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The terminal UI (`hardviz-tui`), with its crossterm backend.
ratatui = "0.29"

# Windows builds carry three `windows` crate versions: eframe 0.37
# (accesskit) uses 0.62, wmi 0.13.4 uses 0.58, and sysinfo 0.32 uses 0.57.
# Upgrading wmi and sysinfo could bring them together.
[target.'cfg(windows)'.dependencies]
wmi = "0.13"

# The SMC and IOReport sources (src/sources/macos/). Both crates are already
# in the tree through winit and sysinfo.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"

# Embeds version information (product name, version, ...) in the Windows
# executables: build.rs, Windows targets only. Code signing requires it.
[build-dependencies]
winresource = { version = "0.1", default-features = false }

# Encodes the README screenshots rendered by `cargo test --lib readme_screenshots -- --ignored`.
[dev-dependencies]
png = "0.18"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
