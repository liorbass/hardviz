[package]
name = "hardviz"
version = "0.1.0"
edition = "2021"
description = "Hardware monitoring dashboard: CPU, GPU, memory, temperatures, network and disks"
# An application, not a library for crates.io.
publish = false

[dependencies]
eframe = "0.29"
egui = "0.29"
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.10"
directories = "5"
# Only the local-time clock, for log timestamps.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Windows builds carry two `windows` crate versions: eframe 0.29 (accesskit)
# and wmi 0.13.4 use 0.58, while every sysinfo release up to 0.33 caps it at
# 0.57. No compatible set of releases shares one version; revisit when
# upgrading eframe or sysinfo.
[target.'cfg(windows)'.dependencies]
wmi = "0.13"

# Encodes the README screenshots rendered by `cargo test --lib readme_screenshots -- --ignored`.
[dev-dependencies]
png = "0.18"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
