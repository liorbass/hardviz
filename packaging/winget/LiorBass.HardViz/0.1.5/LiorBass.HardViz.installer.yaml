# Type: Installer
#
# The release asset is a ZIP holding a folder of loose files, so this uses
# winget's archive support (client 1.5+) with `portable` nested installers —
# two of them, which only `portable` allows.
#
# `ArchiveBinariesDependOnPath: true` puts the install folder itself on PATH
# instead of symlinking the exe into WinGet's `links` directory. HardViz finds
# its bundled LibreHardwareMonitor folder next to the executable, so the files
# must stay where they are and be launched from there.
PackageIdentifier: LiorBass.HardViz
PackageVersion: 0.1.5
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.17763.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: hardviz-windows-x64/hardviz.exe
    PortableCommandAlias: hardviz
  - RelativeFilePath: hardviz-windows-x64/hardviz-tui.exe
    PortableCommandAlias: hardviz-tui
ArchiveBinariesDependOnPath: true
InstallModes:
  - interactive
  - silent
  - silentWithProgress
InstallerScope: user
UpgradeBehavior: uninstallPrevious
ReleaseDate: 2026-11-11
Architectures:
  - Architecture: x64
    InstallerUrl: https://github.com/liorbass/hardviz/releases/download/v0.1.5/hardviz-windows-x64.zip
    InstallerSha256: 1A4D24398530375C74055D5F53C2D95837794809AFAEFF73B0D1AE4A5B5E9157
ManifestType: installer
ManifestVersion: 1.12.0
