name: CI

# Runs when a version is tagged (`git tag v0.2.0 && git push origin v0.2.0`),
# on pull requests (checks only: no packaging or release), or when started by
# hand (Actions tab -> CI -> Run workflow). Ordinary commits to main trigger
# nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer run for the same ref cancels the one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    # Clippy and tests run on every platform: the LHM, ACPI and startup-task
    # code only compiles on Windows, hwmon and diskstats only on Linux, the
    # SMC/IOReport/ioreg sources only on macOS.
    name: Clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # One thread: libtest then prints each test's name before running it,
      # so a test that crashes the process (FFI into private macOS APIs) is
      # named in the log. The suite takes about a second either way.
      - name: Test
        run: cargo test --workspace --locked -- --test-threads=1

  audit:
    # Known vulnerabilities in the locked dependencies (cargo-audit against
    # the RustSec advisory database).
    name: Dependency audit
    runs-on: ubuntu-latest
    # The action reports its findings as a check run, which the default
    # read-only token may not create ("Resource not accessible by
    # integration"). Accepted advisories are listed in .cargo/audit.toml.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  package:
    # Release builds, uploaded as workflow artifacts (Actions run page ->
    # Artifacts). Pull requests run the checks only, not packaging.
    name: Package (${{ matrix.name }})
    needs: [fmt, check]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          # Apple Silicon runner: HardViz.app (ad-hoc signed) + hardviz-tui.
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # LHM's binaries are not in git (only our config and its license are):
      # fetch the official 0.9.6 build, pinned by checksum, so the Windows zip
      # can read CPU temperature out of the box.
      - name: Fetch LibreHardwareMonitor 0.9.6 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v0.9.6/LibreHardwareMonitor.zip"
          Invoke-WebRequest $url -OutFile lhm.zip
          $hash = (Get-FileHash lhm.zip -Algorithm SHA256).Hash
          if ($hash -ne "086D9F1B5A99E643EDC2CFAAAC16051685B551E4C5AC0B32A57C58C0E529C001") {
            throw "LibreHardwareMonitor.zip checksum mismatch: $hash"
          }
          # -Force overwrites binaries only: the zip has no config or license.
          Expand-Archive lhm.zip -DestinationPath vendor/LibreHardwareMonitor -Force

      # Same command as locally (xtask/): release build of both binaries,
      # packaged with LHM on Windows. Fixed names, so README download links
      # can point at releases/latest/download/<name>.
      - name: Package
        run: cargo dist --name ${{ matrix.name }}

      - uses: actions/upload-artifact@v6
        with:
          name: hardviz-${{ matrix.name }}
          path: |
            dist/hardviz-${{ matrix.name }}.zip
            dist/hardviz-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  sign:
    # Authenticode-signs the Windows package through the SignPath Foundation
    # (free for open source projects). Opt-in: the job stays skipped until the
    # SIGNPATH_ORGANIZATION_ID repository variable is set, so releases keep
    # publishing the unsigned zip for as long as the application is pending.
    #
    # What gets signed is decided by .signpath/artifact-configurations/default.xml
    # (our own two executables, not the bundled LibreHardwareMonitor ones).
    name: Sign (Windows)
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      # The action reads the artifact configuration from the repository.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: hardviz-windows-x64
          path: unsigned

      # The signing action takes an artifact id, not a file path.
      - name: Upload the package for signing
        id: for-signing
        uses: actions/upload-artifact@v6
        with:
          name: windows-for-signing
          path: unsigned/hardviz-windows-x64.zip
          if-no-files-found: error

      # build.rs stamps the version resource from Cargo.toml (`0.1.5`), not from
      # the tag (`v0.1.5`), and the configuration compares them.
      - name: Version for the signing request
        id: version
        shell: pwsh
        run: |
          "version=$($env:GITHUB_REF_NAME -replace '^v', '')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: hardviz
          # Must match the signing policy in the SignPath project; a
          # subscription created through the Foundation program starts as
          # `release-signing`.
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: default
          github-artifact-id: ${{ steps.for-signing.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          # A person approves every request in SignPath's UI, so this waits for
          # that click instead of failing the release.
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Upload the signed package
        uses: actions/upload-artifact@v6
        with:
          name: hardviz-windows-x64-signed
          path: signed
          if-no-files-found: error

  release:
    # Pushing a tag like v0.2.0 publishes a GitHub release with every package.
    name: GitHub release
    needs: [package, sign]
    # `sign` is normally skipped (see its gate), and a skipped dependency would
    # skip this job too, hence always() plus the explicit result checks.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.package.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      # One directory per artifact: the signed and unsigned Windows packages
      # hold the same file name, so the release always ships exactly one of
      # them, preferring the signed one.
      - name: Collect the release files
        run: |
          mkdir -p dist
          cp artifacts/hardviz-linux-x64/* artifacts/hardviz-macos-arm64/* dist/
          if compgen -G 'artifacts/hardviz-windows-x64-signed/*' > /dev/null; then
            src=artifacts/hardviz-windows-x64-signed
            echo 'Windows package: Authenticode-signed.'
          else
            src=artifacts/hardviz-windows-x64
            echo 'Windows package: unsigned (SignPath not configured).'
          fi
          cp "$src"/* dist/
          ls -l dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # Shown above the generated notes. SignPath asks for the policy to
          # be linked from every download page.
          body: |
            Downloads below: Windows x64, Linux x64, macOS Apple Silicon. See the [install guide](https://github.com/liorbass/hardviz/blob/main/docs/install.md) and the [Code signing policy](https://github.com/liorbass/hardviz#code-signing-policy).
          generate_release_notes: true
