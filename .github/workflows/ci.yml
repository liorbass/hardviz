name: CI

# Runs only when a version is tagged (`git tag v0.2.0 && git push origin v0.2.0`)
# or when started by hand (Actions tab -> CI -> Run workflow). Ordinary
# commits, docs and comment edits trigger nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A newer run for the same ref cancels the one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    # Clippy and tests run on every platform: the LHM, ACPI and startup-task
    # code only compiles on Windows, hwmon and diskstats only on Linux, the
    # SMC/IOReport/ioreg sources only on macOS.
    name: Clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # One thread: libtest then prints each test's name before running it,
      # so a test that crashes the process (FFI into private macOS APIs) is
      # named in the log. The suite takes about a second either way.
      - name: Test
        run: cargo test --workspace --locked -- --test-threads=1

  package:
    # Release builds, uploaded as workflow artifacts (Actions run page ->
    # Artifacts).
    name: Package (${{ matrix.name }})
    needs: [fmt, check]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          # Apple Silicon runner: HardViz.app (ad-hoc signed) + hardviz-tui.
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # LHM's binaries are not in git (only our config and its license are):
      # fetch the official 0.9.6 build, pinned by checksum, so the Windows zip
      # can read CPU temperature out of the box.
      - name: Fetch LibreHardwareMonitor 0.9.6 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v0.9.6/LibreHardwareMonitor.zip"
          Invoke-WebRequest $url -OutFile lhm.zip
          $hash = (Get-FileHash lhm.zip -Algorithm SHA256).Hash
          if ($hash -ne "086D9F1B5A99E643EDC2CFAAAC16051685B551E4C5AC0B32A57C58C0E529C001") {
            throw "LibreHardwareMonitor.zip checksum mismatch: $hash"
          }
          # -Force overwrites binaries only: the zip has no config or license.
          Expand-Archive lhm.zip -DestinationPath vendor/LibreHardwareMonitor -Force

      # Same command as locally (xtask/): release build of both binaries,
      # packaged with LHM on Windows. Fixed names, so README download links
      # can point at releases/latest/download/<name>.
      - name: Package
        run: cargo dist --name ${{ matrix.name }}

      - uses: actions/upload-artifact@v6
        with:
          name: hardviz-${{ matrix.name }}
          path: |
            dist/hardviz-${{ matrix.name }}.zip
            dist/hardviz-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    # Pushing a tag like v0.2.0 publishes a GitHub release with every package.
    name: GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # Shown above the generated notes. SignPath asks for the policy to
          # be linked from every download page.
          body: |
            Downloads below: Windows x64, Linux x64, macOS Apple Silicon. See the [install guide](https://github.com/liorbass/hardviz/blob/main/docs/install.md) and the [Code signing policy](https://github.com/liorbass/hardviz#code-signing-policy).
          generate_release_notes: true
