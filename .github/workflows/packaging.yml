name: Packaging

# The channels that cannot be checked from a Linux box. Homebrew's audit only
# runs on macOS, so it runs here instead of never running at all. Weekly and by
# hand rather than per push: a tap is touched when a release is cut, and
# `--online` makes calls to GitHub's API that do not need to happen forty times
# a day. Ordinary commits to main still trigger nothing.
on:
  schedule:
    # Mondays, six minutes past six UTC — the hourly jobs cluster on the hour.
    - cron: "6 6 * * 1"
  workflow_dispatch:

# A hand-started run should not cancel the weekly one halfway through, so the
# group only keeps two of the same ref from overlapping.
concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  homebrew:
    name: Brew audit (tap)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Auditing the tap's own clone, not the copy in this repository, is the
      # point: users fetch those bytes. The tap is public, so no token is
      # needed, and brew clones it under the Homebrew repository prefix.
      - name: Tap
        run: brew tap liorbass/tap https://github.com/liorbass/homebrew-tap

      # What a user meets, measured before anything is trusted. Homebrew will
      # not load a cask from a non-official tap that has not been trusted, and
      # the question worth answering is whether a bare `brew upgrade` — the
      # command nobody types the full name for — hits that wall. Order is the
      # whole measurement: naming the cask in an install is believed to record
      # the trust permanently, so anything that must see an untrusted tap runs
      # before the install, and the same three commands run again after it to
      # show what the install left behind. Exit codes are printed rather than
      # raised: the audit below is the gate, this step is the measurement, and
      # a red job should mean a broken channel, not an unexpected answer.
      - name: Observe the trust gate untrusted
        run: |
          set +e
          probe() {
            printf '\n=== %s ===\n' "$*"
            "$@"
            printf 'exit=%s\n' "$?"
          }
          printf '\n######## nothing has been trusted yet ########\n'
          probe brew outdated --cask
          probe brew upgrade --cask --dry-run
          probe brew info --cask liorbass/tap/hardviz
          printf '\n######## the README one-liner ########\n'
          probe brew install --cask liorbass/tap/hardviz
          printf '\n=== the files an install is supposed to have left ===\n'
          ls -ld /Applications/HardViz.app
          ls -l "$(brew --prefix)/bin/hardviz-tui"
          printf 'exit=%s\n' "$?"
          probe brew list --cask
          printf '\n######## after an install that trusted the cask ########\n'
          probe brew outdated --cask
          probe brew upgrade --cask --dry-run
          probe brew info --cask liorbass/tap/hardviz

      # Homebrew refuses to *load* a cask from a non-official tap until it is
      # trusted, and `brew audit` loads it. Naming the cask in an install or
      # upgrade command is consent for that one command; an audit has to say it
      # out loud. A single slash makes brew read the argument as a tap.
      - name: Trust the tap
        run: brew trust liorbass/tap

      - name: Tap and repository must hold the same cask
        run: |
          tap="$(brew --repository)/Library/Taps/liorbass/homebrew-tap"
          diff -u packaging/homebrew-tap/Casks/hardviz.rb "$tap/Casks/hardviz.rb"

      # strict adds the style cops, online adds the download, the checksum, the
      # livecheck and the minimum-macOS comparison against the app bundle.
      - name: brew audit
        run: brew audit --cask --strict --online liorbass/tap/hardviz
